name: Publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE_CREDENTIAL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar aplicação e configuração inicial
        run: npm test
      - name: Autenticar leitura da planilha privada
        if: env.HAS_GOOGLE_CREDENTIAL == 'true'
        id: google
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
      - name: Atualizar dados do Google Sheets
        if: env.HAS_GOOGLE_CREDENTIAL == 'true'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: npm run sync:sheets
      - name: Compilar configuração do repositório
        if: env.HAS_GOOGLE_CREDENTIAL != 'true'
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
